# GitHub Actions CI/CD for Cloudflare Pages
# 
# Funkciók:
# - Push to main → Production deploy
# - PR → Preview deployment + comment with URL
# - Lighthouse CI score check
#
# Szükséges Secrets (GitHub repo Settings > Secrets):
# - CLOUDFLARE_API_TOKEN
# - CLOUDFLARE_ACCOUNT_ID

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # 1. Build és Lint
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npx astro check || true
      
      - name: Build
        run: npm run build
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # 2. Lighthouse CI (csak PR-okon)
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x
      
      - name: Run Lighthouse
        run: |
          lhci autorun --config=.lighthouserc.json || true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Comment Lighthouse Results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Lighthouse results olvasása
            let results = {};
            try {
              const manifest = JSON.parse(fs.readFileSync('.lighthouseci/manifest.json', 'utf8'));
              const summary = manifest[0]?.summary || {};
              results = {
                performance: Math.round((summary.performance || 0) * 100),
                accessibility: Math.round((summary.accessibility || 0) * 100),
                bestPractices: Math.round((summary['best-practices'] || 0) * 100),
                seo: Math.round((summary.seo || 0) * 100),
              };
            } catch (e) {
              console.log('No Lighthouse results found');
              return;
            }
            
            const getEmoji = (score) => {
              if (score >= 90) return '🟢';
              if (score >= 50) return '🟡';
              return '🔴';
            };
            
            const body = `## ⚡ Lighthouse Results

            | Metric | Score |
            |--------|-------|
            | ${getEmoji(results.performance)} Performance | ${results.performance} |
            | ${getEmoji(results.accessibility)} Accessibility | ${results.accessibility} |
            | ${getEmoji(results.bestPractices)} Best Practices | ${results.bestPractices} |
            | ${getEmoji(results.seo)} SEO | ${results.seo} |
            
            ${results.performance < 90 ? '⚠️ Performance is below 90. Consider optimizing.' : '✅ Great performance!'}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # 3. Deploy to Cloudflare Pages
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment-url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ github.event.repository.name }}
      
      - name: Comment Preview URL (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Preview Deployment Ready!
              
              | Environment | URL |
              |-------------|-----|
              | Preview | [${url}](${url}) |
              
              This preview will be available until the PR is closed or a new commit is pushed.`
            });
      
      - name: Output deployment URL
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}"
