# Cloudflare Pages Configuration
# ⚠️ NE TÖLTS FEL API KULCSOKAT! Cloudflare dashboard-on állítsd be az env vars-okat.

name = "project-name"
compatibility_date = "2024-01-01"
pages_build_output_dir = "./dist"

# KV Namespace - Rate limiting a kalkulátor form handler-hez
# Létrehozás: wrangler kv:namespace create RATE_LIMIT_KV
# Utána írd be az ID-t az alábbi sorba
# Jelenleg kikommentelve - a rate limiting gracefully fail-el ha nincs KV
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "YOUR_KV_NAMESPACE_ID_HERE"  # ⚠️ Cseréld le az igazi ID-ra!

# Environment Variables példák (a dashboard-on állítsd be, NE itt!)
# [vars]
# PUBLIC_SITE_URL = "https://example.com"

# Secrets (MINDIG a dashboard-on!)
# GTM_ID, GOOGLE_SHEETS_API_KEY, RESEND_API_KEY, SLACK_WEBHOOK_URL

# ⚠️ Headers és redirects a public/_headers és public/_redirects fájlokban vannak!
# Cloudflare Pages ezeket automatikusan felolvassa.
